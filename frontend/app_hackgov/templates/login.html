{% extends 'index.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/login.css' %}" />

<div class="row auth-wrapper">
    <div class="col-7 auth-panel">
        <div class="auth-panel-grid"></div>
    </div>

    <div class="col-12 col-md-5 auth-form-side">
        <div class="auth-form-box">
            <h1 class="auth-title">Entrar na conta</h1>
            <p class="text-muted mb-3">Preencha o formulário abaixo para entrar na sua conta.</p>

            <form method="POST" action="{% url 'login' %}" id="loginForm">
                {% csrf_token %}
                <input type="hidden" name="csrfmiddlewaretoken" value="CSRF_TOKEN_PLACEHOLDER" />

                <div class="form-group">
                    <label class="form-label" for="email">E-mail</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" id="email" name="email" class="form-control-custom"
                            placeholder="seu.email@email.gov.br" autocomplete="email" required />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" id="password" name="password" class="form-control-custom"
                            placeholder="Digite sua senha" autocomplete="current-password" required />
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar senha">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="pb-3">
                    <a href="#" class="forgot-link text-decoration-none">Esqueci minha senha</a>
                </div>

                <a href="{% url 'dashboard' %}" class="btn btn-primary">
                    Entrar <i class="bi bi-box-arrow-in-right me-1"></i>
                </a>
            </form>

            <div class="pt-3">
                Ainda não tem conta? <a href="{% url 'register' %}" class="text-decoration-none">Criar conta agora</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const togglePass = document.getElementById("togglePass");
    const passInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");
    togglePass.addEventListener("click", () => {
        const isPass = passInput.type === "password";
        passInput.type = isPass ? "text" : "password";
        eyeIcon.className = isPass ? "bi bi-eye-slash" : "bi bi-eye";
    });
</script>
{% endblock content %}
