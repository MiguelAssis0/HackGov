{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP Municipal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/_variables.css' %}" />
    <link rel="stylesheet" href="{% static 'css/_base.css' %}" />
    <link rel="stylesheet" href="{% static 'css/_components.css' %}" />
    <link rel="stylesheet" href="{% static 'css/index_dashboard.css' %}" />
</head>

<body>
    <section class="app-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <a href="{% url 'home' %}" class="brand-txt text-white">ERP <span>Municipal</span></a>
            </div>

            <div class="sidebar-setor">
                <select>
                    <option>Setor / Secretaria</option>
                    <option>Administração</option>
                    <option>Educação</option>
                    <option>Saúde</option>
                    <option>Obras</option>
                    <option>Fazenda</option>
                </select>
            </div>

            <div class="sidebar-search">
                <div class="sidebar-search-wrap">
                    <i class="bi bi-search"></i>
                    <input type="text" class="sidebar-search-input" placeholder="Buscar..." />
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-label">Principal</div>
                <a class="nav-item active" href="#">
                    <i class="bi bi-house-fill"></i> Início
                </a>
                <a class="nav-item" href="#">
                    <i class="bi bi-wrench-adjustable"></i> Ferramentas
                </a>
                <a class="nav-item" href="#">
                    <i class="bi bi-diagram-3"></i> Processos
                    <span class="nav-badge">8</span>
                </a>
                <a class="nav-item" href="#">
                    <i class="bi bi-check2-square"></i> Tarefas
                    <span class="nav-badge">5</span>
                </a>

                <div class="nav-section-label" style="margin-top: 0.5rem">
                    Administração
                </div>
                <a class="nav-item" href="#"> <i class="bi bi-people"></i> Gestão </a>
                <a class="nav-item" href="#">
                    <i class="bi bi-bell"></i> Notificações
                    <span class="nav-badge">13</span>

                </a>
                <a class="nav-item" href="#">
                    <i class="bi bi-gear"></i> Configurações
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-row">
                    <div class="user-avatar">JS</div>
                    <div class="user-info">
                        <div class="user-name">Você</div>
                        <div class="user-role">Administrador</div>
                    </div>
                    <button class="user-settings-btn" title="Configurações">
                        <i class="bi bi-gear"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- OVERLAY -->
        <div class="sidebar-overlay" id="sideOverlay"></div>

        {% block content %}
        {% endblock content %}

        <!-- MOBILE NAV -->
        <nav class="bottom-nav">
            <div class="container">
                <div class="d-flex justify-content-around">
    
                    <button class="bnav-btn active"><i class="bi bi-house-fill"></i>Início</button>
    
                    <button class="bnav-btn"><i class="bi bi-wrench-adjustable"></i>Ferramentas</button>
                    
                    <button class="bnav-btn"><i class="bi bi-search"></i>Buscar</button>
                    
                    <button class="bnav-btn"><i class="bi bi-chat-dots-fill"></i>Chats</button>
    
                    <button class="bnav-btn"><i class="bi bi-person-fill"></i>Perfil</button>
                    
                </div>
            </div>
        </nav>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Mobile sidebar
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sideOverlay");
        const toggle = document.getElementById("sideToggle");
        toggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("show");
        });
        overlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            overlay.classList.remove("show");
        });

        // Mensagem tabs
        document.querySelectorAll(".msg-tab").forEach((tab) => {
            tab.addEventListener("click", () => {
                document
                    .querySelectorAll(".msg-tab")
                    .forEach((t) => t.classList.remove("active"));
                tab.classList.add("active");
            });
        });

        // Mobile nav de baixo
        document.querySelectorAll(".bnav-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                document
                    .querySelectorAll(".bnav-btn")
                    .forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");
            });
        });
    </script>

</body>

</html>
