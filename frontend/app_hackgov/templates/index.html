{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Municipal</title>

    <!-- Coisas do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/_variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/_base.css' %}">
    <link rel="stylesheet" href="{% static 'css/_components.css' %}">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar-custom">
        <div class="container d-flex align-items-center justify-content-between">

            <a class="brand-txt" href="{% url 'home' %}">
                ERP <span>Municipal</span>
            </a>

            <div class="gap-2 d-none d-md-flex">
                <a href="{% url 'login' %}" class="btn btn-outline-primary">
                    Entrar <i class="bi bi-box-arrow-in-right"></i>
                </a>
                <a href="{% url 'register' %}" class="btn btn-primary">
                    Cadastrar <i class="bi bi-person-plus-fill"></i>
                </a>
            </div>

            <div class="d-flex d-md-none">
                <i class="bi bi-list fs-3 text-white"></i>
            </div>

        </div>
    </nav>

    <button id="scrollTopBtn" class="scroll-top-btn" type="button" aria-label="Voltar ao topo">
        <i class="bi bi-arrow-up"></i>
    </button>

    <!-- HOME -->
    {% block content %}
    {% endblock content %}

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">

                <span class="brand-txt">ERP <span>Municipal</span></span>

                <span>Todos os direitos reservados, © 2026.</span>

                <div class="d-flex gap-3">
                    <a href="#">Política de Privacidade</a>
                    <a href="#">Termos de Uso</a>
                    <a href="#">Suporte</a>
                </div>

            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const navbar = document.querySelector(".navbar-custom");
        const scrollTopBtn = document.getElementById("scrollTopBtn");

        const getHeaderOffset = () => {
            return navbar ? navbar.offsetHeight + 12 : 0;
        };

        const scrollToTarget = (target) => {
            const element = document.querySelector(target);
            if (!element) return;

            const top = element.getBoundingClientRect().top + window.pageYOffset - getHeaderOffset();
            window.scrollTo({
                top: Math.max(top, 0),
                behavior: "smooth"
            });
        };

        document.querySelectorAll('a.scroll-link[href^="#"]').forEach((link) => {
            link.addEventListener("click", (e) => {
                const target = link.getAttribute("href");
                const element = document.querySelector(target);

                if (!element) return;

                e.preventDefault();
                scrollToTarget(target);
            });
        });

        if (scrollTopBtn) {
            const toggleScrollButton = () => {
                if (window.scrollY > 400) {
                    scrollTopBtn.classList.add("show");
                } else {
                    scrollTopBtn.classList.remove("show");
                }
            };

            window.addEventListener("scroll", toggleScrollButton, { passive: true });
            toggleScrollButton();

            scrollTopBtn.addEventListener("click", () => {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });
        }

        const observer = new IntersectionObserver(
            (entries) => {
                entries.forEach((e) => {
                    if (e.isIntersecting) e.target.classList.add("visible");
                });
            },
            { threshold: 0.15 },
        );

        document.querySelectorAll(".fade-up").forEach((el) => observer.observe(el));
    </script>

</body>

</html>
