{% extends 'index.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/login.css' %}" />

<div class="row auth-wrapper">
    <div class="col-7 auth-panel">
        <div class="auth-panel-grid"></div>
    </div>

    <div class="col-12 col-md-5 auth-form-side">
        <div class="container">
            <div class="auth-form-box">
                <h1 class="auth-title">Criar conta</h1>
                <p class="text-muted mb-3">Preencha o formulário abaixo para criar sua conta.</p>

                <form method="POST" action="{% url 'register' %}" id="registerForm">
                    {% csrf_token %}
                    <input type="hidden" name="csrfmiddlewaretoken" value="CSRF_TOKEN_PLACEHOLDER" />

                    <div class="form-group-row">
                        <div class="form-group">
                            <label class="form-label" for="first_name">Nome</label>
                            <div class="input-icon-wrap">
                                <i class="bi bi-person input-icon"></i>
                                <input type="text" id="first_name" name="first_name" class="form-control-custom"
                                    placeholder="Digite seu nome" required />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="last_name">Sobrenome</label>
                            <input type="text" id="last_name" name="last_name" class="form-control-custom"
                                placeholder="E seu sobrenome" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="username">Nome de usuário</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-at input-icon"></i>
                            <input type="text" id="username" name="username" class="form-control-custom"
                                placeholder="Digite um nome de usuário" autocomplete="username" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">E-mail</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="email" id="email" name="email" class="form-control-custom"
                                placeholder="seu.email@email.gov.br" autocomplete="email" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password1">Senha</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" id="password1" name="password1" class="form-control-custom"
                                placeholder="Digite uma senha" autocomplete="new-password" required
                                oninput="checkStrength(this.value)" />
                            <button type="button" class="toggle-pass" onclick="togglePassword('password1', this)"
                                aria-label="Mostrar senha">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="pw-strength">
                            <div class="pw-bars">
                                <div class="pw-bar" id="bar1"></div>
                                <div class="pw-bar" id="bar2"></div>
                                <div class="pw-bar" id="bar3"></div>
                                <div class="pw-bar" id="bar4"></div>
                            </div>
                            <span class="pw-label" id="pwLabel">Digite uma senha com mínimo de 8 caracteres, 1 letra maiúscula,
                                1 número e 1 caractere especial.</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password2">Confirmar senha</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-lock-fill input-icon"></i>
                            <input type="password" id="password2" name="password2" class="form-control-custom"
                                placeholder="Repita a senha" autocomplete="new-password" required />
                            <button type="button" class="toggle-pass" onclick="togglePassword('password2', this)"
                                aria-label="Mostrar senha">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <label class="pb-3 pt-2">
                        <input type="checkbox" name="accept_terms" required />
                        Concordo com os <a href="#" class="text-decoration-none"><span>Termos de Uso</span></a> e a
                        <a href="#" class="text-decoration-none"><span>Política de Privacidade</span></a> do ERP Municipal
                    </label>

                    <a href="{% url 'dashboard' %}" class="btn btn-primary">
                        Criar conta <i class="bi bi-person-plus-fill me-1"></i>
                    </a>
                </form>

                <div class="pt-3">
                    Já tem conta? <a href="{% url 'login' %}" class="text-decoration-none">Entrar agora</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector("i");
        const isPass = input.type === "password";
        input.type = isPass ? "text" : "password";
        icon.className = isPass ? "bi bi-eye-slash" : "bi bi-eye";
    }

    function checkStrength(val) {
        const bars = [
            document.getElementById("bar1"),
            document.getElementById("bar2"),
            document.getElementById("bar3"),
            document.getElementById("bar4"),
        ];
        const label = document.getElementById("pwLabel");
        bars.forEach((b) => {
            b.className = "pw-bar";
        });

        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^a-zA-Z0-9]/.test(val)) score++;

        const cls = score <= 1 ? "weak" : score <= 3 ? "medium" : "strong";
        const labels = { weak: "Fraca", medium: "Média", strong: "Forte" };
        for (let i = 0; i < score; i++) bars[i].classList.add(cls);
        label.textContent =
            val.length === 0 ? "Digite uma senha com mínimo de 8 caracteres, 1 letra maiúscula, 1 número e 1 caractere especial." : `Senha ${labels[cls]}`;
    }
</script>
{% endblock %}
